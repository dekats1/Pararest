# Конфигурация для интеграционных @DataJpaTest тестов.
# H2 определяется автоматически (start.spring.io / spring-boot-test),
# но явные настройки оставлены для наглядности, как в методичке ЛБ2.
spring.datasource.url=jdbc:h2:mem:inventory_test_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
