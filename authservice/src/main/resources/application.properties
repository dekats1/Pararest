server.port=8081
spring.application.name=authservice

services.user-service.create-user.url=/api/v1/users/createNewUser

springdoc.api-docs.path=/v3/api-docs/auth
server.forward-headers-strategy= framework
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
jwt.ttl-seconds:86400
jwt.refresh-token-expire-mill=604800000
oauth2.redirect-uri=http://localhost:5173/oauth2/callback

spring.security.oauth2.client.registration.github.provider=github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.profiles.active=local
